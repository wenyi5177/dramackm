<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留白叙事 | 我的追剧手账</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Serif SC', -apple-system, sans-serif;
            background-color: #fcfbfa; /* 温暖舒适的画廊微白 */
            color: #2D312E;
            transition: background-color 0.4s ease;
        }
        .serif-title {
            font-family: 'Noto Serif SC', serif;
            font-weight: 500;
        }
        /* 极简手账阴影 */
        .journal-shadow {
            box-shadow: 0 4px 20px -2px rgba(142, 147, 137, 0.12), 0 2px 8px -1px rgba(142, 147, 137, 0.08);
        }
        .journal-shadow:hover {
            box-shadow: 0 12px 30px -4px rgba(142, 147, 137, 0.2), 0 4px 12px -2px rgba(142, 147, 137, 0.1);
        }
        /* 深色沉浸式毛玻璃 */
        .glass-panel {
            background: rgba(20, 21, 33, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 页面加载动画 */
        #loader {
            background-color: #fcfbfa;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-stone-200">

    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center">
        <div class="space-y-4 text-center">
            <div class="h-[1px] w-12 bg-stone-400 mx-auto animate-pulse"></div>
            <p class="serif-title text-stone-500 tracking-widest text-xs">正在翻开记忆手账...</p>
        </div>
    </div>

    <header class="max-w-6xl w-full mx-auto px-6 pt-16 pb-12 text-center space-y-4">
        <div class="text-[10px] tracking-[0.2em] text-stone-400 uppercase font-medium">Personal Drama Archive</div>
        <h1 class="text-3xl md:text-4xl serif-title text-stone-800 tracking-wide">我的追剧记录</h1>
        <p class="text-xs text-stone-400 italic">“ 记录每一部感动的瞬间，留住荧幕里的碎屑与光影。 ”</p>
        <div class="w-8 h-[1px] bg-stone-300 mx-auto pt-2"></div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto px-6 pb-20 space-y-10">
        
        <section class="flex flex-col md:flex-row items-center justify-between gap-6 border-b border-stone-200/60 pb-6">
            <div class="flex items-center gap-1 overflow-x-auto w-full md:w-auto no-scrollbar py-1">
                <button onclick="filterCategory('All')" class="cat-tab text-xs px-4 py-2 rounded-full transition-all cursor-pointer bg-stone-900 text-stone-50 font-medium" data-category="All">全部记忆</button>
                <button onclick="filterCategory('C-Drama')" class="cat-tab text-xs px-4 py-2 rounded-full text-stone-500 hover:text-stone-800 hover:bg-stone-200/50 transition-all cursor-pointer" data-category="C-Drama">华语剧</button>
                <button onclick="filterCategory('K-Drama')" class="cat-tab text-xs px-4 py-2 rounded-full text-stone-500 hover:text-stone-800 hover:bg-stone-200/50 transition-all cursor-pointer" data-category="K-Drama">韩剧</button>
                <button onclick="filterCategory('Western Series')" class="cat-tab text-xs px-4 py-2 rounded-full text-stone-500 hover:text-stone-800 hover:bg-stone-200/50 transition-all cursor-pointer" data-category="Western Series">欧美剧</button>
                <button onclick="filterCategory('Japanese Drama')" class="cat-tab text-xs px-4 py-2 rounded-full text-stone-500 hover:text-stone-800 hover:bg-stone-200/50 transition-all cursor-pointer" data-category="Japanese Drama">日剧</button>
                <button onclick="filterCategory('Thai Drama')" class="cat-tab text-xs px-4 py-2 rounded-full text-stone-500 hover:text-stone-800 hover:bg-stone-200/50 transition-all cursor-pointer" data-category="Thai Drama">泰剧</button>
                <button onclick="filterCategory('Movies')" class="cat-tab text-xs px-4 py-2 rounded-full text-stone-500 hover:text-stone-800 hover:bg-stone-200/50 transition-all cursor-pointer" data-category="Movies">电影</button>
                <button onclick="filterCategory('Anime')" class="cat-tab text-xs px-4 py-2 rounded-full text-stone-500 hover:text-stone-800 hover:bg-stone-200/50 transition-all cursor-pointer" data-category="Anime">动漫</button>
            </div>
            
            <div class="relative w-full md:w-64 flex-shrink-0">
                <input type="text" id="search-bar" oninput="searchDrama()" placeholder="搜寻剧名、碎屑记忆..." class="w-full bg-stone-100 border border-stone-200/80 rounded-lg pl-4 pr-10 py-2 text-xs focus:outline-none focus:border-stone-400 transition placeholder-stone-400 text-stone-700">
                <i class="fa-solid fa-feather-pointed absolute right-4 top-1/2 -translate-y-1/2 text-stone-300 text-xs"></i>
            </div>
        </section>

        <section id="journal-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </section>

    </main>

    <div id="cinema-modal" class="fixed inset-0 z-50 bg-[#06070d]/95 backdrop-blur-2xl opacity-0 pointer-events-none transition-all duration-500 overflow-y-auto no-scrollbar flex items-center justify-center p-4 md:p-10">
        <div class="absolute top-1/4 left-1/4 w-80 h-80 bg-purple-600/10 rounded-full blur-[100px] pointer-events-none"></div>
        <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-blue-600/10 rounded-full blur-[100px] pointer-events-none"></div>

        <div class="glass-panel max-w-4xl w-full rounded-2xl p-6 md:p-10 relative shadow-2xl transition-all duration-500 translate-y-8 opacity-0 scale-95" id="cinema-card">
            <button onclick="closeCinemaView()" class="absolute top-6 right-6 text-stone-500 hover:text-stone-200 transition text-sm cursor-pointer w-8 h-8 rounded-full bg-white/5 flex items-center justify-center border border-white/10">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div id="modal-content" class="grid grid-cols-1 md:grid-cols-12 gap-8 text-stone-300 text-sm"></div>
        </div>
    </div>

    <footer class="w-full text-center py-12 border-t border-stone-200/40 text-[11px] text-stone-400 space-y-1">
        <p class="serif-title">留白叙事 · 情感数字档案馆</p>
        <p class="opacity-60">© 2026 Designed for personal memories.</p>
    </footer>

    <script>
        // 模拟高质感文青手账数据
        const journalData = [
            {
                id: "item-1",
                title: "琉璃",
                year: "2020",
                category: "C-Drama",
                countryLabel: "中国大陆",
                genres: ["仙侠", "玄幻", "虐恋"],
                rating: "9.6",
                shortReview: "司凤用十生十世的隐忍付出，在残缺的六识里种出了一颗血淋淋却最炽热的心。",
                quote: "“褚璇玑，你是个没有心的人。”",
                character: "禹司凤 (成毅 饰)",
                scenes: "第十世离泽宫前揭下面具、司凤屡次为爱受刑吐血却眼神坚定的高能瞬间。",
                thoughts: "这绝不是一部快餐仙侠，它把中式神话里的执念与因果写到了极致。司凤的爱不是占有，是近乎自虐的成全，每次看都会被中式古典美学里的悲剧色彩深深震撼。",
                watchDate: "2026春末 · 留存",
                moodTags: "🍵 宿命感 / 😭 暴风哭泣",
                poster: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500"
            },
            {
                id: "item-2",
                title: "沉香如屑 · 沉香重华",
                year: "2022",
                category: "C-Drama",
                countryLabel: "中国大陆",
                genres: ["古装", "仙侠", "苍生"],
                rating: "9.3",
                shortReview: "菡萏香销，沉香成屑。他为了肩上的苍生重担克制了所有爱意，却在眼神里泛滥成灾。",
                quote: "“我满眼都是他，可他为了天下苍生，唯独负了我。”",
                character: "应渊 / 唐周 / 玄夜",
                scenes: "夜忘川八百年的长河枯等、应渊帝君在地止白发缚树的绝望自我禁锢。",
                thoughts: "这是一首带着古典悲剧美德的诗。成毅一人分饰三角的破碎感拿捏得惊人，尤其是神界的隐忍与凡间的肆意形成强烈反差，让关于神仙也有“爱别离、求不得”的宏大设定立住了脚。",
                watchDate: "2026-04-12",
                moodTags: "🍂 凄美浪漫 / 🏛️ 宏大格局",
                poster: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=500"
            },
            {
                id: "item-3",
                title: "怪奇物语 第四季",
                year: "2022",
                category: "Western Series",
                countryLabel: "美国",
                genres: ["科幻", "复古", "惊悚"],
                rating: "9.5",
                shortReview: "当复古摇滚乐在危机时刻轰鸣响起，那不只是少年的逃亡，更是对青春与友谊最热烈的赞歌。",
                quote: "“Keep running, Max!”",
                character: "Max Mayfield / Eddie Munson",
                scenes: "Max戴着耳机在红色梦魇空间拼命奔跑，奔向现实中呼唤她的朋友们；Eddie在异世界楼顶弹奏吉他引开怪物。",
                thoughts: "完全超越了前几季的厚度。通过音乐和心魔隐喻青少年的创伤与成长，那一幕幕美式复古美学与宏大的配乐交织在一起，浪漫热血到骨子里，它是真正属于次世代的胶片记忆。",
                watchDate: "2025年冬",
                moodTags: "🎸 热血沸腾 / 📺 复古胶片",
                poster: "https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?w=500"
            }
        ];

        let activeCategory = "All";

        // 页面初始化
        window.onload = () => {
            // 模拟雅致的加载延迟
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }, 600);

            renderGrid(journalData);
        };

        // 核心：手账网格渲染器
        function renderGrid(data) {
            const grid = document.getElementById('journal-grid');
            grid.innerHTML = '';

            if (data.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-20 text-center text-stone-400 space-y-2">
                        <i class="fa-solid fa-eraser text-xl opacity-50"></i>
                        <p class="text-xs italic">这页手账纸上，还没有留下关于此分类的墨迹...</p>
                    </div>
                `;
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = "group bg-white rounded-xl overflow-hidden journal-shadow border border-stone-200/40 p-4 transition-all duration-300 cursor-pointer flex flex-col space-y-4";
                card.setAttribute('onclick', `openCinemaView('${item.id}')`);

                card.innerHTML = `
                    <div class="w-full aspect-[3/4] rounded-lg overflow-hidden bg-stone-100 relative">
                        <img src="${item.poster}" alt="${item.title}" class="w-full h-full object-cover grayscale-[20%] group-hover:grayscale-0 transition-all duration-500 group-hover:scale-102">
                        <span class="absolute top-3 left-3 bg-stone-900/80 backdrop-blur-md text-stone-100 text-[9px] tracking-widest px-2 py-0.5 rounded font-medium">${item.countryLabel}</span>
                    </div>
                    <div class="space-y-2 flex-grow flex flex-col justify-between">
                        <div class="space-y-1">
                            <div class="flex items-center justify-between text-stone-400 text-[10px]">
                                <span>${item.year} 出品</span>
                                <span class="bg-stone-100 text-stone-600 px-1.5 py-0.5 rounded text-[9px]">${item.category}</span>
                            </div>
                            <h3 class="text-base serif-title text-stone-800 tracking-wide group-hover:text-stone-500 transition-colors">${item.title}</h3>
                        </div>
                        <p class="text-xs text-stone-400 line-clamp-2 leading-relaxed italic border-l border-stone-200 pl-2 pt-1">${item.shortReview}</p>
                        <div class="flex flex-wrap gap-1 pt-2">
                            ${item.genres.map(g => `<span class="bg-stone-50 border border-stone-200/60 text-stone-500 text-[9px] px-2 py-0.5 rounded-full">${g}</span>`).join('')}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 动态分类过滤
        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-tab').forEach(btn => {
                if(btn.getAttribute('data-category') === cat) {
                    btn.className = "cat-tab text-xs px-4 py-2 rounded-full transition-all cursor-pointer bg-stone-900 text-stone-50 font-medium";
                } else {
                    btn.className = "cat-tab text-xs px-4 py-2 rounded-full text-stone-500 hover:text-stone-800 hover:bg-stone-200/50 transition-all cursor-pointer";
                }
            });
            executeFilter();
        }

        // 搜索功能
        function searchDrama() {
            executeFilter();
        }

        // 综合执行过滤器 (分类+搜索)
        function executeFilter() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const filtered = journalData.filter(item => {
                const matchCat = (activeCategory === "All" || item.category === activeCategory);
                const matchQuery = item.title.toLowerCase().includes(query) || 
                                   item.shortReview.toLowerCase().includes(query) || 
                                   item.thoughts.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });
            renderGrid(filtered);
        }

        // 打开沉浸式暗黑院线详情页
        function openCinemaView(id) {
            const item = journalData.find(d => d.id === id);
            if(!item) return;

            const modal = document.getElementById('cinema-modal');
            const card = document.getElementById('cinema-card');
            const content = document.getElementById('modal-content');

            // 注入专属于暗黑美学、情绪饱满的影评架构
            content.innerHTML = `
                <div class="md:col-span-4 space-y-4">
                    <div class="rounded-xl overflow-hidden shadow-2xl border border-white/5 relative aspect-[3/4]">
                        <img src="${item.poster}" alt="${item.title}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#06070d] via-transparent to-transparent"></div>
                    </div>
                    <div class="bg-white/5 border border-white/5 rounded-xl p-4 text-center space-y-1">
                        <span class="text-[10px] text-stone-500 uppercase tracking-widest block">心流私藏评分</span>
                        <div class="text-2xl font-semibold text-purple-400 font-serif"><i class="fa-solid fa-star text-xs mr-1 text-amber-400"></i>${item.rating} <span class="text-xs text-stone-600">/ 10</span></div>
                    </div>
                </div>

                <div class="md:col-span-8 space-y-6">
                    <div>
                        <div class="flex items-center gap-2 text-[10px] text-stone-500 mb-1">
                            <span>${item.countryLabel}</span>•<span>${item.year}</span>•<span>${item.category}</span>
                        </div>
                        <h2 class="text-2xl serif-title text-white tracking-wide">${item.title}</h2>
                        <div class="flex flex-wrap gap-1 mt-2">
                            ${item.genres.map(g => `<span class="bg-purple-500/10 border border-purple-500/20 text-purple-300 text-[10px] px-2 py-0.5 rounded">${g}</span>`).join('')}
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-white/5 border border-white/5 p-3 rounded-lg">
                            <span class="text-[10px] text-purple-400 block mb-1"><i class="fa-solid fa-user-ninja mr-1"></i> 坠爱角色</span>
                            <span class="text-xs text-stone-200 font-medium">${item.character}</span>
                        </div>
                        <div class="bg-white/5 border border-white/5 p-3 rounded-lg">
                            <span class="text-[10px] text-blue-400 block mb-1"><i class="fa-solid fa-calendar-day mr-1"></i> 留存日期 / 情绪状态</span>
                            <span class="text-xs text-stone-200 font-medium">${item.watchDate} ${item.moodTags}</span>
                        </div>
                    </div>

                    <div class="bg-gradient-to-r from-purple-950/20 to-transparent border-l-2 border-purple-500 p-4 rounded-r-lg italic text-stone-200 text-sm">
                        <i class="fa-solid fa-quote-left text-[10px] text-purple-400 mr-2"></i>${item.quote}
                    </div>

                    <div class="space-y-1">
                        <h4 class="text-[10px] text-stone-500 uppercase tracking-widest font-semibold">📍 脑海高能定格</h4>
                        <p class="text-xs text-stone-300 leading-relaxed">${item.scenes}</p>
                    </div>

                    <div class="space-y-1 border-t border-white/5 pt-4">
                        <h4 class="text-[10px] text-stone-400 uppercase tracking-widest font-semibold flex items-center gap-1.5">
                            <span class="w-1 h-3 bg-purple-500 rounded-full"></span> 观后呓语 · Personal Thoughts
                        </h4>
                        <p class="text-xs text-stone-400 leading-relaxed text-justify whitespace-pre-line">${item.thoughts}</p>
                    </div>
                </div>
            `;

            // 触发动画显现
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('translate-y-8', 'opacity-0', 'scale-95');
            document.body.style.overflow = 'hidden'; // 锁定底层滚动
        }

        // 关闭详情
        function closeCinemaView() {
            const modal = document.getElementById('cinema-modal');
            const card = document.getElementById('cinema-card');
            
            card.classList.add('translate-y-8', 'opacity-0', 'scale-95');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.body.style.overflow = ''; // 恢复滚动
        }
    </script>
</body>
</html>
