                    <div class="col-span-full py-20 text-center text-stone-400 space-y-2">
                        <i class="fa-solid fa-eraser text-xl opacity-50"></i>
                        <p class="text-xs italic">这页手账纸上，还没有留下关于此分类的墨迹...</p>
                    </div>
                `;
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = "group bg-white rounded-xl overflow-hidden journal-shadow border border-stone-200/40 p-4 transition-all duration-300 cursor-pointer flex flex-col space-y-4";
                card.setAttribute('onclick', `openCinemaView('${item.id}')`);

                card.innerHTML = `
                    <div class="w-full aspect-[3/4] rounded-lg overflow-hidden bg-stone-100 relative">
                        <img src="${item.poster}" alt="${item.title}" class="w-full h-full object-cover grayscale-[10%] group-hover:grayscale-0 transition-all duration-500 group-hover:scale-102" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500'">
                        <span class="absolute top-3 left-3 bg-stone-900/80 backdrop-blur-md text-stone-100 text-[9px] tracking-widest px-2 py-0.5 rounded font-medium">${item.countryLabel}</span>
                    </div>
                    <div class="space-y-2 flex-grow flex flex-col justify-between">
                        <div class="space-y-1">
                            <div class="flex items-center justify-between text-stone-400 text-[10px]">
                                <span>${item.year} 年份记录</span>
                                <span class="bg-stone-50 border border-stone-200/40 text-stone-500 px-1.5 py-0.5 rounded text-[9px]">${item.category}</span>
                            </div>
                            <h3 class="text-base serif-title text-stone-800 tracking-wide transition-colors">${item.title}</h3>
                        </div>
                        <p class="text-xs text-stone-400 line-clamp-2 leading-relaxed italic border-l border-stone-200 pl-2 pt-1">${item.shortReview}</p>
                        <div class="flex flex-wrap gap-1 pt-2">
                            ${item.genres.map(g => `<span class="bg-stone-50 border border-stone-200/60 text-stone-500 text-[9px] px-2 py-0.5 rounded-full">${g}</span>`).join('')}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 动态分类过滤
        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-tab').forEach(btn => {
                if(btn.getAttribute('data-category') === cat) {
                    btn.className = "cat-tab text-xs px-4 py-2 rounded-full transition-all cursor-pointer bg-stone-900 text-stone-50 font-medium";
                } else {
                    btn.className = "cat-tab text-xs px-4 py-2 rounded-full text-stone-500 hover:text-stone-800 hover:bg-stone-200/50 transition-all cursor-pointer";
                }
            });
            executeFilter();
        }

        // 搜索功能
        function searchDrama() {
            executeFilter();
        }

        // 综合执行过滤器 (分类+搜索)
        function executeFilter() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const filtered = journalData.filter(item => {
                const matchCat = (activeCategory === "All" || item.category === activeCategory);
                const matchQuery = item.title.toLowerCase().includes(query) || 
                                   item.shortReview.toLowerCase().includes(query) || 
                                   item.thoughts.toLowerCase().includes(query) ||
                                   item.character.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });
            renderGrid(filtered);
        }

        // 打开沉浸式暗黑院线详情页
        function openCinemaView(id) {
            const item = journalData.find(d => d.id === id);
            if(!item) return;

            const modal = document.getElementById('cinema-modal');
            const card = document.getElementById('cinema-card');
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <div class="md:col-span-4 space-y-4">
                    <div class="rounded-xl overflow-hidden shadow-2xl border border-white/5 relative aspect-[3/4]">
                        <img src="${item.poster}" alt="${item.title}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500'">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#05060a] via-transparent to-transparent"></div>
                    </div>
                    <div class="bg-white/5 border border-white/5 rounded-xl p-4 text-center space-y-1">
                        <span class="text-[10px] text-stone-500 uppercase tracking-widest block">心流私藏评分</span>
                        <div class="text-2xl font-semibold text-purple-400 font-serif"><i class="fa-solid fa-star text-xs mr-1 text-amber-400"></i>${item.rating} <span class="text-xs text-stone-600">/ 10</span></div>
                    </div>
                </div>

                <div class="md:col-span-8 space-y-6">
                    <div>
                        <div class="flex items-center gap-2 text-[10px] text-stone-500 mb-1">
                            <span>${item.countryLabel}</span>•<span>${item.year}</span>•<span>${item.category}</span>
                        </div>
                        <h2 class="text-2xl serif-title text-white tracking-wide">${item.title}</h2>
                        <div class="flex flex-wrap gap-1 mt-2">
                            ${item.genres.map(g => `<span class="bg-purple-500/10 border border-purple-500/20 text-purple-300 text-[10px] px-2 py-0.5 rounded">${g}</span>`).join('')}
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-white/5 border border-white/5 p-3 rounded-lg">
                            <span class="text-[10px] text-purple-400 block mb-1"><i class="fa-solid fa-user-ninja mr-1"></i> 坠爱角色</span>
                            <span class="text-xs text-stone-200 font-medium">${item.character}</span>
                        </div>
                        <div class="bg-white/5 border border-white/5 p-3 rounded-lg">
                            <span class="text-[10px] text-blue-400 block mb-1"><i class="fa-solid fa-calendar-day mr-1"></i> 留存状态 / 追剧心绪</span>
                            <span class="text-xs text-stone-200 font-medium">${item.watchDate} &nbsp; ${item.moodTags}</span>
                        </div>
                    </div>

                    <div class="bg-gradient-to-r from-purple-950/20 to-transparent border-l-2 border-purple-500 p-4 rounded-r-lg italic text-stone-200 text-sm">
                        <i class="fa-solid fa-quote-left text-[10px] text-purple-400 mr-2"></i>${item.quote}
                    </div>

                    <div class="space-y-1">
                        <h4 class="text-[10px] text-stone-500 uppercase tracking-widest font-semibold">📍 脑海高能定格</h4>
                        <p class="text-xs text-stone-300 leading-relaxed">${item.scenes}</p>
                    </div>

                    <div class="space-y-1 border-t border-white/5 pt-4">
                        <h4 class="text-[10px] text-stone-400 uppercase tracking-widest font-semibold flex items-center gap-1.5">
                            <span class="w-1 h-3 bg-purple-500 rounded-full"></span> 观后呓语 · Personal Thoughts
                        </h4>
                        <p class="text-xs text-stone-400 leading-relaxed text-justify whitespace-pre-line">${item.thoughts}</p>
                    </div>
                </div>
            `;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('translate-y-8', 'opacity-0', 'scale-95');
            document.body.style.overflow = 'hidden';
        }

        // 关闭详情
        function closeCinemaView() {
            const modal = document.getElementById('cinema-modal');
            const card = document.getElementById('cinema-card');
            
            card.classList.add('translate-y-8', 'opacity-0', 'scale-95');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.body.style.overflow = '';
        }
    </script>
</body>
</html>
